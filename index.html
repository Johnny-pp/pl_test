<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#178f91" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <title>幻兽远征</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        background: #79cbd1;
        overflow: hidden;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        touch-action: none;
        overscroll-behavior: none;
        color: #17334d;
        font-family: "Trebuchet MS", "Microsoft YaHei", sans-serif;
      }
      #game {
        width: 100vw;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      canvas {
        max-width: 100%;
        max-height: 100%;
      }
      .game-loading {
        color: #0d6f76;
        font-size: 1.1rem;
        font-weight: 700;
        letter-spacing: 0.08em;
      }
      .fatal-error {
        max-width: 34rem;
        margin: 1rem;
        padding: 1.5rem;
        border: 3px solid #c44555;
        border-radius: 1.2rem;
        background: #fffbeb;
        box-shadow: 0 0.8rem 2rem rgba(23, 51, 77, 0.22);
        text-align: center;
      }
      .fatal-error h1 {
        color: #a62f42;
      }
      .fatal-error button {
        padding: 0.7rem 1.2rem;
        border: 0;
        border-radius: 0.8rem;
        background: #178f91;
        box-shadow: 0 0.25rem 0 #0d6f76;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
      canvas {
        border-radius: clamp(0px, 1.6vw, 18px);
        box-shadow: 0 1.2rem 3rem rgba(23, 51, 77, 0.28);
      }
      canvas:focus-visible {
        outline: 4px solid #fff4b8;
        outline-offset: -4px;
      }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="game-status" class="sr-only" role="status" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
